# tsqldump/docker-compose.yml

version: '3.8'

services:
  test-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: tsqldump_test_db
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

