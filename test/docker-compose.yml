# tsqldump/docker-compose.yml

services:
  test-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: tsqldump_test_db
    ports:
      - "1433:1433"

  test-runner:
    build:
      context: ..
      dockerfile: test/Dockerfile.test
    container_name: tsqldump_test_runner
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - DB_HOST=test-db
    volumes:
      - ./output:/app/test/output
    depends_on:
      test-db:
        condition: service_healthy

